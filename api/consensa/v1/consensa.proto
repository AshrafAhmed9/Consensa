syntax = "proto3";
package consensa.v1;
option go_package = "github.com/ashraf/consensa/api/consensa/v1;consensav1";

service Consensa {
  rpc Upsert(stream UpsertRequest) returns (UpsertResponse);
  rpc Search(SearchRequest) returns (stream SearchResult);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}
message Vector { repeated float values = 1; }
message UpsertRequest { string id = 1; Vector vector = 2; }
message UpsertResponse { uint64 accepted = 1; }
message SearchRequest { Vector query = 1; uint32 k = 2; uint32 ef = 3; }
message SearchResult { string id = 1; float distance = 2; }
message DeleteRequest { string id = 1; }
message DeleteResponse {}
message BatchGetRequest { repeated string ids = 1; }
message BatchGetResponse { map<string, Vector> vectors = 1; }
message StatusRequest {}
message StatusResponse { string role = 1; uint64 term = 2; }

// ConsensaKV is a separate service from Consensa (the vector-index plane) on purpose: it
// exposes internal/txn's cross-range 2PC coordinator, which has nothing to do with the
// HNSW Index a Consensa server wraps. See internal/server/kv_service.go's doc comment for
// the full reasoning and what this deliberately does not yet cover (single-key writes,
// reads, and the DurableRange-per-range assembly are the caller's job today).
service ConsensaKV {
  rpc TransactionalPut(TransactionalPutRequest) returns (TransactionalPutResponse);
}
message TransactionalPutRequest {
  // txn_id must be unique per transaction; the caller picks it (a UUID, typically) since
  // only the caller knows whether a retried call is the same transaction or a new one.
  string txn_id = 1;
  map<string, bytes> writes = 2;
}
message TransactionalPutResponse {}

// ConsensaAdmin is a separate service again, for the same reason ConsensaKV is separate
// from Consensa: it exposes a different, unrelated primitive -- internal/raft's joint-
// consensus membership-change primitives (Host.AddKnownPeer, Host.AddPeer,
// DurableRange.ProposeConfChange), proven in internal/raft/new_node_join_test.go against
// real processes but until this service nothing reachable over the network could ever
// drive them. Like every other RPC in this codebase, this is gated by internal/auth's
// optional shared-secret bearer-token interceptor (--auth-token in cmd/consensa/main.go),
// off by default -- a valid token authorizes every RPC in every service on this shared
// grpc.Server equally, including this one; there is no per-service or per-method scoping,
// stated plainly since a valid client credential is not restricted from calling
// membership-change RPCs specifically. A real deployment should also put this behind TLS
// (internal/auth's own doc comment states why the token layer alone does not protect
// against network eavesdropping) before exposing it publicly.
service ConsensaAdmin {
  // AddReplica registers a new (possibly brand-new, previously-unknown) node's ID and
  // transport address on the named range, so a subsequent PromoteReplica call naming that
  // ID can succeed -- see kv.DurableRange.AddKnownPeer/AddPeerAddress's own doc comments
  // for why these are two separate, local, per-replica steps rather than one RPC.
  rpc AddReplica(AddReplicaRequest) returns (AddReplicaResponse);
  // PromoteReplica drives kv.DurableRange.ProposeConfChange against the named range's
  // current leader, moving it through Raft's joint-consensus protocol to the requested
  // voter/learner sets. It fails if this node isn't currently that range's leader --
  // callers should retry against a different node, mirroring TransactionalPut's own
  // "route to whoever's actually in charge" contract.
  rpc PromoteReplica(PromoteReplicaRequest) returns (PromoteReplicaResponse);
}
message AddReplicaRequest {
  uint64 range_id = 1;
  uint64 node_id = 2;
  string address = 3;
}
message AddReplicaResponse {}
message PromoteReplicaRequest {
  uint64 range_id = 1;
  repeated uint64 voter_ids = 2;
  repeated uint64 learner_ids = 3;
}
message PromoteReplicaResponse {}
